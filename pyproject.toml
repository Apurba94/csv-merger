[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-merger"
version = "0.1.0"
description = "Merge multiple CSV files on keys with conflict reporting and column reconciliation."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
csv-merger = "csv_merger.cli:main"

[tool.setuptools]
packages = ["csv_merger"]
